# @package _global_

defaults:
  - _self_
  - data: null
  - model: null
  - task: null

output_dir: ./runs/train/${now:%Y-%m-%d}_${now:%H-%M-%S}

# dataloading
batch_size: 2
num_workers: 4
prefetch_factor: null      # null -> PyTorch default (2). Lower (e.g. 1) reduces worker queue memory.
persistent_workers: false  # true keeps workers alive across epochs (skips re-fork)

# scheduler
lr_scheduler_type: "cosine"
learning_rate: 1.0e-4
warmup_steps: null          # null uses 5% warmup; set 0 for no warmup.
num_epochs: 1
max_steps: null
log_every: 10
save_every: 100
keep_latest_weights: 4  # Maximum number of complete weight checkpoints retained on disk.
keep_latest_state_only: false  # true keeps only the latest resumable training state.
eval_every: 0  # Simulator evaluation runs separately through scripts/evaluate.sh.
rank_timer_every: 10
rank_timer_sync_cuda: true

# training
gradient_accumulation_steps: 1
mixed_precision: "bf16" # one of: [no, fp16, bf16]
seed: 42
max_grad_norm: 1.0
weight_decay: 0.0
resume: null

# wandb
wandb:
  enabled: false
  workspace: null
  project: genpa
  name: train
  group: null
  mode: disabled

hydra:
  job:
    chdir: false
  run:
    dir: .
  output_subdir: null
