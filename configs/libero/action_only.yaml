output_dir: ${oc.env:GENPA_OUTPUT_DIR}
batch_size: 10
num_workers: 24
prefetch_factor: 2
persistent_workers: true
lr_scheduler_type: cosine
learning_rate: 0.0001
warmup_steps: null
num_epochs: 10
max_steps: 36750
log_every: 10
save_every: 2000
keep_latest_weights: 10
keep_latest_state_only: true
eval_every: 0
rank_timer_every: 100
rank_timer_sync_cuda: true
gradient_accumulation_steps: 1
mixed_precision: bf16
seed: 42
max_grad_norm: 1.0
weight_decay: 0.01
resume: null
wandb:
  enabled: false
  workspace: null
  project: genpa
  name: genpa_libero_action_only
  group: null
  mode: disabled
data:
  train:
    _target_: genpa.datasets.lerobot.robot_video_dataset.RobotVideoDataset
    dataset_dirs:
    - ${oc.env:GENPA_LIBERO_DATA}
    shape_meta:
      images:
      - key: image
        raw_shape:
        - 3
        - 512
        - 512
        shape:
        - 3
        - 224
        - 224
      - key: wrist_image
        raw_shape:
        - 3
        - 512
        - 512
        shape:
        - 3
        - 224
        - 224
      action:
      - key: default
        raw_shape: 7
        shape: 7
      state:
      - key: default
        raw_shape: 8
        shape: 8
    num_frames: 17
    global_sample_stride: 1
    action_video_freq_ratio: 1
    video_size:
    - 224
    - 448
    camera_key: null
    val_set_proportion: 0.0
    is_training_set: true
    skip_padding_as_possible: false
    concat_multi_camera: horizontal
    video_augmentation:
      _target_: genpa.datasets.lerobot.transforms.image.VideoAugmentation
      p: 0.65
      augment_types:
      - corrupt_only
      - color_only
      - both
      - both
      color_jitter:
        brightness: 0.3
        contrast: 0.3
        saturation: 0.25
        hue: 0.04
      gamma:
        range:
        - 0.8
        - 1.25
      gaussian_noise:
        std: 0.015
      random_resized_crop:
        scale:
        - 0.92
        - 1.0
        ratio: preserve
      rotate:
        degrees: 8.0
        fill: mean
      exposure:
        ev_range:
        - -0.25
        - 0.25
    endpoint_frames_only: true
    qwen_text_cache_dir: ${oc.env:GENPA_LIBERO_QWEN_CACHE}
    qwen_context_len: 128
    pretrained_norm_stats: ${oc.env:GENPA_LIBERO_STATS}
    processor:
      _target_: genpa.datasets.lerobot.processors.genpa_processor.GenPAProcessor
      shape_meta:
        images:
        - key: image
          raw_shape:
          - 3
          - 512
          - 512
          shape:
          - 3
          - 224
          - 224
        - key: wrist_image
          raw_shape:
          - 3
          - 512
          - 512
          shape:
          - 3
          - 224
          - 224
        action:
        - key: default
          raw_shape: 7
          shape: 7
        state:
        - key: default
          raw_shape: 8
          shape: 8
      num_obs_steps: 17
      image_obs_steps: 2
      num_output_cameras: 2
      action_output_dim: 7
      proprio_output_dim: 8
      delta_action_dim_mask:
        default:
        - true
        - true
        - true
        - true
        - true
        - true
        - false
      action_state_transforms: null
      use_stepwise_action_norm: false
      norm_default_mode: min/max
      norm_exception_mode: null
      action_state_merger:
        _target_: genpa.datasets.lerobot.transforms.action_state_merger.ConcatLeftAlign
      train_transforms:
      - _target_: genpa.datasets.lerobot.transforms.image.ToTensor
      - _target_: torchvision.transforms.Resize
        size:
        - 224
        - 224
      val_transforms:
      - _target_: genpa.datasets.lerobot.transforms.image.ToTensor
      - _target_: torchvision.transforms.Resize
        size:
        - 224
        - 224
    prompt_template: '{task}'
    nonidle_filter_path: ${oc.env:GENPA_LIBERO_KEEP_RANGES}
    visual_supervision:
      enabled: false
model:
  _target_: genpa.models.backbones.genpa.create_genpa
  flux2_src_path: ${oc.env:GENPA_FLUX2_SRC}
  flux2_model_path: ${oc.env:GENPA_FLUX2_WEIGHTS}
  ae_model_path: ${oc.env:GENPA_FLUX2_AE}
  qwen3_model_spec: ${oc.env:GENPA_QWEN3}
  variant: klein-base-4b
  qwen_context_len: 128
  prefix_length: 16
  proprio_dim: 8
  checkpoint_blocks: false
  flux_learning_rate: 1.0e-05
  adapter_learning_rate: 0.0001
  visual_train_shift: 5.0
  visual_num_train_timesteps: 1000
  lambda_visual: 0.0
  action_adapter_config:
    action_horizon: 16
    action_dim: 7
    hidden_dim: 512
    num_layers: 4
    num_heads: 8
    mlp_ratio: 4.0
    dropout: 0.0
save_final_checkpoint: true

hydra:
  run:
    dir: ${output_dir}
  job:
    chdir: false
