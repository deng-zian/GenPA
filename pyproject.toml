[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "genpa"
version = "0.1.0"
description = "Image Generators as Efficient Robot Policies"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["hydra-core==1.3.2", "omegaconf==2.3.0", "PyYAML"]

[project.optional-dependencies]
data = [
    "numpy==1.26.4",
    "h5py==3.16.0",
    "pyarrow==23.0.0",
    "av==16.0.1",
    "huggingface-hub==0.36.2",
]
inference = [
    "torch>=2.4.1",
    "torchvision>=0.19.1",
    "numpy==1.26.4",
    "einops==0.8.1",
    "safetensors==0.5.3",
    "huggingface-hub==0.36.2",
    "rich",
]

[project.urls]
Homepage = "https://deng-zian.github.io/GenPA-website/"
Repository = "https://github.com/deng-zian/GenPA"
Paper = "https://arxiv.org/abs/2611.27446"

[tool.setuptools.packages.find]
where = ["src"]
include = ["genpa*"]
namespaces = false
